<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Work</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            text-align:center;
            width:400px;
        }

        h2{
            color:#333;
            margin-bottom:25px;
        }

        .links{
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .links a{
            text-decoration:none;
            background:#4f46e5;
            color:white;
            padding:12px;
            border-radius:8px;
            font-size:18px;
            transition:0.3s;
        }

        .links a:hover{
            background:#3730a3;
            transform:translateY(-3px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2> Practice Assignments</h2>

        <div class="links">
            <a href="practice1.html">Practice 1</a>
            <a href="practice2.html">Practice 2</a>
            <a href="practice3.html">Practice 3</a>
            <a href="practice4.html">Practice 4</a>
        </div>
    </div>

</body>
</html>
